<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Maazul Haque - Software Engineer profile banner">
  <defs>
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="dark-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="dark-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#a371f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="dark-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="8" fill="url(#dark-bg)"/>

  <line x1="80" y1="320" x2="1200" y2="320" stroke="url(#dark-line)" stroke-width="1"/>

  <text x="640" y="160" text-anchor="middle" fill="#e6edf3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1">Maazul Haque</text>

  <text x="640" y="200" text-anchor="middle" fill="url(#dark-accent)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="3">SOFTWARE ENGINEER</text>

  <line x1="560" y1="220" x2="720" y2="220" stroke="url(#dark-accent)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <text x="640" y="260" text-anchor="middle" fill="#8b949e" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400">Full Stack Developer &amp;bull; Building scalable web, mobile &amp; AI-powered applications</text>

  <text x="640" y="290" text-anchor="middle" fill="#484f58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14">Next.js &amp;bull; React &amp;bull; TypeScript &amp;bull; Node.js &amp;bull; Python &amp;bull; React Native</text>

  <rect x="80" y="50" width="4" height="40" rx="2" fill="#58a6ff" opacity="0.3"/>
  <rect x="80" y="50" width="4" height="24" rx="2" fill="#58a6ff" opacity="0.7"/>
  <rect x="1268" y="50" width="4" height="40" rx="2" fill="#a371f7" opacity="0.3"/>
  <rect x="1268" y="66" width="4" height="24" rx="2" fill="#a371f7" opacity="0.7"/>

  <circle cx="160" cy="80" r="2" fill="#58a6ff" opacity="0.4"/>
  <circle cx="200" cy="120" r="1.5" fill="#a371f7" opacity="0.3"/>
  <circle cx="1100" cy="90" r="2" fill="#a371f7" opacity="0.4"/>
  <circle cx="1060" cy="130" r="1.5" fill="#58a6ff" opacity="0.3"/>
  <circle cx="300" cy="350" r="1" fill="#58a6ff" opacity="0.2"/>
  <circle cx="980" cy="340" r="1" fill="#a371f7" opacity="0.2"/>
</svg>
